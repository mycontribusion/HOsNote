<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#1d4ed8" />
  <meta name="description" content="HOsNote – Patient tracker and clinical notebook for medical teams. Zero-network, offline-first." />
  <!-- Preload the most-used font weights so they are cached on first visit and
       served from cache on every subsequent cold start (PWA/Android). -->
  <link rel="preload" as="font" href="/fonts/Inter-400.ttf" type="font/ttf" crossorigin />
  <link rel="preload" as="font" href="/fonts/Inter-500.ttf" type="font/ttf" crossorigin />
  <link rel="preload" as="font" href="/fonts/Inter-600.ttf" type="font/ttf" crossorigin />
  <link rel="preload" as="font" href="/fonts/Inter-700.ttf" type="font/ttf" crossorigin />
  <link rel="preload" as="font" href="/fonts/Inter-800.ttf" type="font/ttf" crossorigin />
  <!-- Open Graph -->
  <meta property="og:title" content="HOsNote – Patient Tracker & Notebook" />
  <meta property="og:description" content="Track patients, write notes, archive forever. No internet needed." />
  <meta property="og:type" content="website" />
  <!-- UPDATE: Replace with your actual deployment URL (e.g., https://your-domain.com/) -->
  <meta property="og:url" content="https://hosnote.vercel.app/" />
  <!-- UPDATE: Replace with your actual deployment URL for the banner image -->
  <meta property="og:image" content="https://hosnote.vercel.app/hosnote-banner.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="HOsNote – Patient Tracker & Notebook" />
  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="HOsNote – Patient Tracker & Notebook" />
  <meta name="twitter:description" content="Track patients, write notes, archive forever. No internet needed." />
  <!-- UPDATE: Replace with your actual deployment URL for the banner image -->
  <meta name="twitter:image" content="https://hosnote.vercel.app/hosnote-banner.png" />
  <title>HOsNote – Patient Tracker & Notebook</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
